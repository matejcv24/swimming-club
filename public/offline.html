<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#001031">
        <title>SC Hydra - Offline</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                padding: 24px;
                box-sizing: border-box;
                background: #001031;
                color: #fff;
                font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
                text-align: center;
            }

            img {
                width: 120px;
                height: 120px;
                border-radius: 24px;
            }

            h1 {
                margin: 0;
                font-size: 22px;
            }

            p {
                margin: 0;
                max-width: 320px;
                color: #b8c4dd;
                line-height: 1.5;
            }

            button {
                margin-top: 8px;
                padding: 12px 24px;
                border: 0;
                border-radius: 8px;
                background: #1e8fd6;
                color: #fff;
                font-size: 16px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <img src="/icons/icon-192.png" alt="SC Hydra">
        <h1>You're offline</h1>
        <p>SC Hydra needs an internet connection. Check your signal and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </body>
</html>
